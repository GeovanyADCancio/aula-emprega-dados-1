services:
  postgres:
    image: postgres:16
    container_name: mentoria_pg
    environment:
      POSTGRES_DB: mentoria
      POSTGRES_USER: mentoria
      POSTGRES_PASSWORD: mentoria
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentoria -d mentoria"]
      interval: 5s
      retries: 10

volumes:
  pgdata: