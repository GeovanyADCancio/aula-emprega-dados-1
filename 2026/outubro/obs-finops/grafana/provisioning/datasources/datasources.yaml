apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true

  - name: Postgres
    uid: metricas
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: metricas
    jsonData:
      database: metricas
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: metricas